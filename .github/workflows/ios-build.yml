name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build CatMerge (iOS Simulator + unsigned device app)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project CatMerge.xcodeproj \
            -scheme CatMerge \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath DerivedData \
            build

      - name: Package simulator app
        run: |
          APP=$(find DerivedData/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "Found: $APP"
          ditto -c -k --keepParent "$APP" CatMerge-iOS-Simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: CatMerge-iOS-Simulator
          path: CatMerge-iOS-Simulator.zip
          retention-days: 30

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project CatMerge.xcodeproj \
            -scheme CatMerge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath DerivedDataDevice \
            build || echo "unsigned device build skipped"

      - name: Package unsigned IPA
        run: |
          APP=$(find DerivedDataDevice/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -n "$APP" ]; then
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry CatMerge-unsigned.ipa Payload
          else
            echo "no device app produced"
          fi

      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CatMerge-unsigned-IPA
          path: CatMerge-unsigned.ipa
          if-no-files-found: ignore
          retention-days: 30
